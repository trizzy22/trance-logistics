<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D3D3D3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="globeGloss" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background (dark) -->
  <rect width="300" height="300" fill="#1a1a2e"/>

  <!-- Outer ring circle -->
  <circle cx="150" cy="130" r="95" fill="none" stroke="#0066FF" stroke-width="3" opacity="0.5"/>
  <circle cx="150" cy="130" r="100" fill="none" stroke="#00AAFF" stroke-width="1.5" opacity="0.3"/>

  <!-- Globe (3D effect) -->
  <circle cx="150" cy="130" r="75" fill="url(#globeGradient)" filter="url(#shadow)"/>
  <circle cx="150" cy="130" r="75" fill="url(#globeGloss)"/>
  
  <!-- Continents (simplified but recognizable) -->
  <g opacity="0.4" fill="#ffffff">
    <!-- Europe -->
    <path d="M 140 90 Q 145 85 150 90 Q 148 95 143 95 Z"/>
    <!-- Africa -->
    <path d="M 155 100 Q 160 105 158 115 Q 152 118 150 110 Z"/>
    <!-- Americas -->
    <path d="M 110 115 Q 105 120 108 130 Q 115 128 115 120 Z"/>
  </g>

  <!-- Grid lines on globe -->
  <circle cx="150" cy="130" r="75" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  <ellipse cx="150" cy="130" rx="75" ry="25" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>

  <!-- Large "TF" Monogram (3D Blue) -->
  <defs>
    <filter id="textShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.6" flood-color="#000000"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="1" flood-opacity="0.3" flood-color="#ffffff"/>
    </filter>
  </defs>

  <!-- "T" Letter -->
  <g filter="url(#textShadow)">
    <!-- Main T body -->
    <path d="M 80 160 L 80 245 L 105 245 L 105 185 L 135 185 L 135 160 Z" fill="url(#blueGradient)" stroke="#003D99" stroke-width="1.5"/>
    <!-- T highlight -->
    <path d="M 82 162 L 82 200 L 105 200 L 105 162 Z" fill="white" opacity="0.25"/>
  </g>

  <!-- "F" Letter -->
  <g filter="url(#textShadow)">
    <!-- Main F body -->
    <path d="M 165 160 L 165 245 L 190 245 L 190 210 L 220 210 L 220 185 L 190 185 L 190 160 Z" fill="url(#blueGradient)" stroke="#003D99" stroke-width="1.5"/>
    <!-- F highlight -->
    <path d="M 167 162 L 167 180 L 190 180 L 190 162 Z" fill="white" opacity="0.25"/>
  </g>

  <!-- Airplane (positioned upper left of globe) -->
  <g transform="translate(95, 70)" filter="url(#shadow)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#1F2937" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Wings -->
    <rect x="-22" y="-1.5" width="44" height="3" fill="#1F2937" rx="1.5" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Tail wing -->
    <polygon points="-22,-1 -32,-4 -32,2" fill="#1F2937" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Cockpit -->
    <circle cx="-6" cy="-1.5" r="2" fill="#FFD700" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Engine glow -->
    <circle cx="0" cy="0" r="2.5" fill="#FF6B35" opacity="0.6"/>
  </g>

  <!-- Truck (positioned lower left of globe) -->
  <g transform="translate(75, 180)" filter="url(#shadow)">
    <!-- Cabin -->
    <rect x="-10" y="-8" width="12" height="10" fill="#2D3748" rx="1.5" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Trailer/Cargo -->
    <rect x="4" y="-7" width="18" height="8" fill="#0066FF" rx="1" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Front wheel -->
    <circle cx="-6" cy="4" r="3.5" fill="#2D3748" stroke="#888888" stroke-width="1"/>
    <circle cx="-6" cy="4" r="2" fill="#111111"/>
    <!-- Back wheels -->
    <circle cx="10" cy="4" r="3.5" fill="#2D3748" stroke="#888888" stroke-width="1"/>
    <circle cx="10" cy="4" r="2" fill="#111111"/>
    <circle cx="16" cy="4" r="3.5" fill="#2D3748" stroke="#888888" stroke-width="1"/>
    <circle cx="16" cy="4" r="2" fill="#111111"/>
    <!-- Window -->
    <rect x="-8" y="-5" width="6" height="4" fill="#87CEEB" rx="0.5" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
  </g>

  <!-- Ship (positioned lower right/center of globe) -->
  <g transform="translate(210, 190)" filter="url(#shadow)">
    <!-- Hull -->
    <path d="M -16 0 L -18 5 L 18 5 L 16 0 Z" fill="#2D3748" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Superstructure -->
    <rect x="-8" y="-10" width="16" height="10" fill="#1F2937" rx="1.5" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Stack/Smokestack -->
    <rect x="-3" y="-15" width="6" height="6" fill="#FF6B35" rx="1" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Porthole -->
    <circle cx="0" cy="-5" r="2" fill="#87CEEB" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
    <!-- Water line -->
    <line x1="-18" y1="5" x2="18" y2="5" stroke="#0099FF" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Company name and tagline -->
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066FF" text-anchor="middle" letter-spacing="2">TRANCE</text>
  <text x="150" y="288" font-family="Arial, sans-serif" font-size="12" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">LOGISTICS</text>
  <text x="150" y="300" font-family="Arial, sans-serif" font-size="9" fill="#0099FF" text-anchor="middle" letter-spacing="0.5">CONNECTING WORLDS. DELIVERING EXCELLENCE.</text>
</svg>